<script>
const esc = s => String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

// ── People ───────────────────────────────────────────────────────────────────
// Collaborators live in content/people.json; content text refers to them as {{key}}

let PEOPLE = {};
const PERSON_TOKEN = /\{\{(\w+)\}\}/g;

function personLinkHtml(p) {
    return `<a class="text-link person-link" href="${esc(p.href)}" target="_blank">${esc(p.name)}<span class="person-card">`
         + `<img src="${esc(p.photo)}" alt=""><span class="person-card-text">`
         + `<span class="person-card-name">${esc(p.name)}</span>`
         + `<span class="person-card-title">${esc(p.title)}</span>`
         + `<span class="person-card-dept">${esc(p.dept)}</span></span></span></a>`;
}

// Expands {{key}} tokens into hover-card links
const richText = s => String(s).replace(PERSON_TOKEN, (m, k) => PEOPLE[k] ? personLinkHtml(PEOPLE[k]) : m);
// Plain-text version for the terminal
const plainText = s => String(s).replace(PERSON_TOKEN, (m, k) => PEOPLE[k] ? PEOPLE[k].name : m).replace(/<[^>]+>/g, '');

// ── Nav ──────────────────────────────────────────────────────────────────────

}

// ── Hero ─────────────────────────────────────────────────────────────────────

function renderHero(data) {
    const user = esc(data.terminal.user);
    document.getElementById('home').innerHTML = `
        <p class="hero-eyebrow fade-in">// ${esc(data.eyebrow)}</p>
        <h1 class="hero-name fade-in" aria-label="${esc(data.name.first)} ${esc(data.name.last)}">${esc(data.name.first)} <span>${esc(data.name.last)}</span></h1>
        <div class="term fade-in" id="term">
            <div class="term-bar" aria-hidden="true">
                <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
                <span class="term-title">${user}: ~</span>
            </div>
            <div class="term-body" id="term-body" aria-live="polite"></div>
            <form class="term-input-row" id="term-form" hidden>
                <span class="term-prompt">${user}:~$</span>
                <input class="term-input" id="term-input" aria-label="Terminal command"
                       autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type 'help' to explore" />
            </form>
        </div>
        <div class="hero-bottom fade-in">
            <a class="hero-cta" href="#experience">View Experience →</a>
        </div>`;
}

const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, REDUCED_MOTION ? 0 : ms));

// Text "decrypts" from random glyphs, revealing left to right. Works on a Text node or element.
const GLYPHS = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghkmnpqrstuvwxyz0123456789#$%&*<>/=+';

function decodeText(node, { delay = 0, duration = 900, swapEvery = 80 } = {}) {
    const final = node.textContent;
    if (REDUCED_MOTION || !final.trim()) return;
    const scramble = shown => [...final]
        .map((ch, i) => i < shown || ch === ' ' ? ch : GLYPHS[Math.random() * GLYPHS.length | 0]).join('');
    node.textContent = scramble(0);
    const t0 = performance.now() + delay;
    let lastSwap = 0;
    const tick = now => {
        const k = Math.max(0, Math.min(1, (now - t0) / duration));
        // Glyphs only reshuffle every `swapEvery` ms; every frame (60 fps) reads as a blur
        if (k === 1) node.textContent = final;
        else if (now - lastSwap >= swapEvery) { lastSwap = now; node.textContent = scramble(Math.floor(final.length * k)); }
        if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    // Safety net: rAF pauses in background tabs, so make sure the real text always lands
    setTimeout(() => { node.textContent = final; }, delay + duration + 400);
}

function decodeHeroName() {
    const h1 = document.querySelector('.hero-name');
    decodeText(h1.firstChild, { duration: 2200, swapEvery: 65 });
    decodeText(h1.querySelector('span'), { delay: 600, duration: 2200, swapEvery: 65 });
}

// ── Matrix rain (Konami code / `matrix`) ─────────────────────────────────────

const KONAMI = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];

// Runs for a few seconds, or until a click / Esc; returns false if it can't start
function matrixRain(ms = 9000) {
    if (REDUCED_MOTION || document.querySelector('.matrix-rain')) return false;
    const canvas = document.createElement('canvas');
    canvas.className = 'matrix-rain';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.appendChild(canvas);
    const g = canvas.getContext('2d');
    const size = 16, chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789CASTIELZHANG';
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    const drops = Array.from({ length: Math.ceil(canvas.width / size) }, () => -Math.random() * canvas.height / size);
    g.font = `${size}px ${getComputedStyle(document.body).getPropertyValue('--mono')}`;

    let last = 0, raf;
    const frame = now => {
        raf = requestAnimationFrame(frame);
        if (now - last < 45) return;   // ~22 fps reads as "digital rain"; 60 fps just looks smeared
        last = now;
        g.fillStyle = 'rgba(0, 0, 0, 0.08)';
        g.fillRect(0, 0, canvas.width, canvas.height);
        drops.forEach((y, i) => {
            const ch = chars[Math.random() * chars.length | 0];
            g.fillStyle = Math.random() < 0.04 ? '#e9ffe9' : '#3cff6b';
            g.fillText(ch, i * size, y * size);
            drops[i] = y * size > canvas.height && Math.random() > 0.975 ? 0 : y + 1;
        });
    };
    raf = requestAnimationFrame(frame);

    const stop = () => {
        clearTimeout(timer);
        removeEventListener('keydown', onKey);
        canvas.classList.add('is-leaving');
        setTimeout(() => { cancelAnimationFrame(raf); canvas.remove(); }, 800);
    };
    const onKey = e => { if (e.key === 'Escape') stop(); };
    const timer = setTimeout(stop, ms);
    canvas.addEventListener('click', stop);
    addEventListener('keydown', onKey);
    return true;
}

function setupKonami() {
    let pos = 0;
    addEventListener('keydown', e => {
        const key = e.key.toLowerCase();
        pos = key === KONAMI[pos] ? pos + 1 : (key === KONAMI[0] ? 1 : 0);
        if (pos === KONAMI.length) { pos = 0; matrixRain(); }
    });
}

// ── Little extras ─────────────────────────────────────────────────────────────

// Hello to anyone who opens DevTools

        + `Source: https://github.com/CastielZhang/castielzhang.github.io`,

// The tab title waves at visitors who switch away

    const title = document.title;
    document.addEventListener('visibilitychange', () => {
        document.title = document.hidden ? '👀 Come back… · Castiel Zhang' : title;
    });
}

// ── Hero terminal ─────────────────────────────────────────────────────────────

const term = {
    body: null, user: '', commands: {}, history: [], histPos: 0,

    line(html, cls = 'term-out') {
        const p = document.createElement('p');
        p.className = cls;
        p.innerHTML = html;
        this.body.appendChild(p);
        this.body.scrollTop = this.body.scrollHeight;
        return p;
    },
    promptLine(cmd = '') {
        return this.line(`<span class="term-prompt">${esc(this.user)}:~$</span> <span class="term-cmd">${esc(cmd)}</span>`, 'term-line');
    },
    print(lines) { [].concat(lines).forEach(l => this.line(l)); },

    // Plays the intro once: commands are typed character by character, output appears instantly
    async intro(steps) {
        for (const step of steps) {
            const cmdEl = this.promptLine().querySelector('.term-cmd');
            await sleep(350);
            for (const ch of step.cmd) { cmdEl.textContent += ch; await sleep(55); }
            await sleep(250);
            this.print(step.out.map(esc));
            await sleep(400);
        }
    },

    run(raw) {
        const input = raw.trim();
        this.promptLine(input);
        if (!input) return;
        this.history.push(input);
        this.histPos = this.history.length;
        const [name, ...args] = input.split(/\s+/);
        const fn = this.commands[input] || this.commands[name.toLowerCase()];
        if (fn) fn(args);
        else this.print(`command not found: ${esc(name)} — try <span class="term-hl">help</span>`);
    },
};

const NEOFETCH_ART = [
    '  ____ _____',
    ' / ___|__  /',
    '| |     / / ',
    '| |___ / /_ ',
    ' \\____/____|',
];

// Longest prefix shared by every word, e.g. ['contact', 'cd'] → 'c'
const commonPrefix = words => words.reduce((a, b) => {
    let i = 0;
    while (i < a.length && a[i] === b[i]) i++;
    return a.slice(0, i);
});

function setupTerminal(hero, sections, ctx) {
    term.body = document.getElementById('term-body');
    term.user = hero.terminal.user;
    const termEl = document.getElementById('term');
    const form   = document.getElementById('term-form');
    const input  = document.getElementById('term-input');
    const ids = sections.map(s => s.id);
    // "Files" are the intro's `cat <file>` steps, plus resume.pdf which opens the print dialog
    const files = [...hero.terminal.intro.map(s => s.cmd.match(/^cat (\S+)$/)?.[1]).filter(Boolean), 'resume.pdf'];
    const goto = id => document.getElementById(id).scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth' });
    const row = (k, v) => `<span class="term-hl">${esc(k.padEnd(12))}</span>${v}`;
    const kv  = (k, v) => `<span class="term-hl">${esc(k)}</span>: ${v}`;
    // Hides the prompt while an animated command plays, then hands focus back
    const busy = async fn => {
        form.hidden = true;
        await fn();
        form.hidden = false;
        input.focus({ preventScroll: true });
    };

    // Intro commands can be re-run by typing them
    for (const step of hero.terminal.intro) term.commands[step.cmd] = () => term.print(step.out.map(esc));

    Object.assign(term.commands, {
        help: () => term.print([
            row('whoami', 'who I am'),
            row('about', 'a short bio'),
            row('projects', 'what I\'ve built'),
            row('skills', 'technical stack'),
            row('contact', 'get in touch'),
            row('neofetch', 'system info'),
            row('ls', 'list sections and files'),
            row('cd <name>', 'jump to a section, e.g. cd experience'),
            row('cat <file>', 'read a file, e.g. cat resume.pdf'),
            row('history', 'previous commands'),
            row('clear', 'clear the screen'),
            '<span class="term-dim">Tip: press Tab to autocomplete</span>',
        ]),
        about: () => term.print(ctx.about.paragraphs.map(p => esc(plainText(p)))),
        projects: () => term.print(sortByStart(ctx.experience.items).map(i =>
            `<span class="term-dim">${esc(formatDate(i.date).padEnd(22))}</span>${esc(i.name)}`)),
        skills: () => term.print(ctx.skills.groups.map(g => row(g.title, esc(g.items.join(', '))))),
        contact: () => term.print([
            ...(ctx.contact.email ? [row('email', `<a class="term-link" href="mailto:${esc(ctx.contact.email)}">${esc(ctx.contact.email)}</a>`)] : []),
            ...ctx.contact.links.map(l => row(l.label.toLowerCase(), `<a class="term-link" href="${esc(l.href)}" target="_blank">${esc(l.href.replace(/^https?:\/\/(www\.)?/, ''))}</a>`)),
        ]),
        ls: () => term.print([...ids.map(id => `<span class="term-hl">${esc(id)}/</span>`), ...files.map(esc)].join('  ')),
        cd: ([dest = '']) => {
            const id = dest.replace(/^[~./]+|\/$/g, '').toLowerCase();
            if (!id) return;
            if (ids.includes(id)) goto(id);
            else term.print(`cd: no such section: ${esc(dest)} — try <span class="term-hl">ls</span>`);
        },
        cat: ([file]) => {
            if (!file) return term.print('usage: cat &lt;file&gt; — try <span class="term-hl">ls</span>');
            if (file === 'resume.pdf') {
                term.print('Opening print dialog… choose "Save as PDF" to download.');
                return setTimeout(() => print(), 300);
            }
            const fn = term.commands[`cat ${file}`];
            if (fn) fn();
            else term.print(`cat: ${esc(file)}: No such file or directory`);
        },
        neofetch: () => {
            const exp = ctx.experience, [name, host] = term.user.split('@');
            const tenure = exp.company.tenure;
            const swatches = ['accent', 'c-blue', 'c-green', 'c-orange', 'c-purple']
                .map(c => `<span class="term-swatch" style="background:var(--${c})"></span>`).join('');
            const info = [
                `<span class="term-prompt">${esc(name)}</span>@<span class="term-prompt">${esc(host)}</span>`,
                `<span class="term-dim">${'-'.repeat(term.user.length)}</span>`,
                kv('OS', `Human (${esc(tenure.location)})`),
                kv('Host', esc(exp.company.name)),
                kv('Uptime', esc(calcDuration(tenure.start, tenure.end))),
                kv('Projects', esc(exp.items.length)),
                kv('Stack', esc(ctx.skills.groups.map(g => g.items[0]).join(' · '))),
                kv('Shell', 'portfolio-sh'),
                '',
                swatches,
            ];
            term.print(info.map((line, i) =>
                `<span class="term-art">${esc((NEOFETCH_ART[i] || '').padEnd(15))}</span>${line}`));
        },
        history: () => term.print(term.history.map((h, i) => `<span class="term-dim">${String(i + 1).padStart(4)}</span>  ${esc(h)}`)),
        date: () => term.print(esc(new Date().toLocaleString('en-AU', { timeZone: 'Australia/Sydney', dateStyle: 'full', timeStyle: 'long' }))),
        echo: args => term.print(esc(args.join(' '))),
        exit: () => busy(async () => {
            term.print(['logout', `Connection to ${esc(location.hostname || 'localhost')} closed.`]);
            await sleep(1500);
            term.body.innerHTML = '';
            term.print(`Last login: ${esc(new Date().toString().slice(0, 24))} on ttys001`);
        }),
        rm: args => {
            const flags = args.filter(a => a.startsWith('-')).join('');
            if (!(flags.includes('r') && flags.includes('f') && args.some(a => /^\/\*?$/.test(a))))
                return term.print(`rm: cannot remove '${esc(args.at(-1) || '')}': Permission denied`);
            return busy(async () => {
                for (const id of ids) { term.print(`removed '/${esc(id)}/'`); await sleep(160); }
                term.print('<span class="term-err">Kernel panic — not syncing: portfolio not found</span>');
                termEl.classList.add('is-crashed');
                await sleep(1600);
                termEl.classList.remove('is-crashed');
                term.body.innerHTML = '';
                term.print(['Rebooting…', 'Restored from backup. Nothing was harmed 🙂']);
            });
        },
        clear: () => { term.body.innerHTML = ''; },
        matrix: () => term.print(matrixRain()
            ? 'Wake up, Neo… <span class="term-dim">(click or Esc to exit)</span>'
            : 'The Matrix is resting — reduced motion is on.'),
        sudo: args => {
            const name = term.user.split('@')[0];
            const cmd  = args.join(' ').toLowerCase();
            if (!cmd) return term.print('usage: sudo &lt;command&gt;');
            if (cmd === 'make me a sandwich') return term.print('Okay. 🥪');
            if (cmd === '!!') return term.print(`<span class="term-dim">nice reflex.</span> But ${esc(name)} still isn't root.`);
            // Anything else gets a fake password prompt that "types" a few asterisks, then the classic refusal
            return busy(async () => {
                const p = term.line(`[sudo] password for ${esc(name)}: `);
                for (let i = 0; i < 8; i++) { await sleep(90); p.textContent += '*'; }
                await sleep(500);
                term.print(/^rm\b/.test(cmd) && /-\w*r\w*f|-\w*f\w*r/.test(cmd)
                    ? `${esc(name)} is not in the sudoers file. And definitely not for <span class="term-err">${esc(args.join(' '))}</span>. This incident will be reported. 😉`
                    : `${esc(name)} is not in the sudoers file. This incident will be reported. 😉`);
            });
        },
    });
    term.commands.open = term.commands.cd;

    // Tab completes command names, then section names after cd/open and file names after cat.
    // With several matches it fills the shared prefix and lists the options, like a real shell.
    const ARG_COMPLETIONS = { cd: ids, open: ids, cat: files };
    const HIDDEN = ['sudo', 'rm', 'open', 'matrix'];
    const complete = value => {
        const parts = value.trimStart().split(/\s+/);
        const word  = parts.pop().toLowerCase();
        const pool  = parts.length
            ? (parts.length === 1 && ARG_COMPLETIONS[parts[0].toLowerCase()]) || []
            : Object.keys(term.commands).filter(c => !c.includes(' ') && !HIDDEN.includes(c));
        const matches = pool.filter(c => c.startsWith(word));
        if (!matches.length) return value;
        const head = parts.length ? parts.join(' ') + ' ' : '';
        if (matches.length === 1) return head + matches[0] + (!parts.length && ARG_COMPLETIONS[matches[0]] ? ' ' : '');
        term.promptLine(value);
        term.print(matches.map(m => `<span class="term-hl">${esc(m)}</span>`).join('  '));
        return head + commonPrefix(matches);
    };

    form.addEventListener('submit', e => { e.preventDefault(); term.run(input.value); input.value = ''; });
    input.addEventListener('keydown', e => {
        // On an empty prompt Tab moves focus as usual, so keyboard users can still leave the terminal
        if (e.key === 'Tab' && !e.shiftKey && input.value.trim()) {
            e.preventDefault();
            input.value = complete(input.value);
            return;
        }
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        term.histPos = Math.max(0, Math.min(term.history.length, term.histPos + (e.key === 'ArrowUp' ? -1 : 1)));
        input.value = term.history[term.histPos] || '';
    });
    // Clicking anywhere in the window focuses the prompt (but not when selecting text or following a link)
    document.getElementById('term').addEventListener('click', e => {
        if (!form.hidden && !e.target.closest('a') && !getSelection().toString()) input.focus({ preventScroll: true });
    });

    term.intro(hero.terminal.intro).then(() => { form.hidden = false; });
}

// ── Section wrapper ───────────────────────────────────────────────────────────

function sectionHtml(section, index, inner) {
    const num = String(index).padStart(2, '0');
    return `
<section id="${section.id}"${section.pdf === false ? ' class="no-print"' : ''}>
    <p class="section-label fade-in">// ${num}. ${esc(section.nav.toUpperCase())}</p>
    <h2 class="section-title fade-in">${esc(section.title)}</h2>
    ${inner}
</section>`;
}

// ── Section renderers ─────────────────────────────────────────────────────────

// Stats with an "auto" key are derived from the Experience and Education content
const AUTO_STATS = {
    // Floored to the nearest half year, e.g. 54 months → "4.5"
    yearsAtCompany: ({ experience: exp }) => String(Math.floor(monthsBetween(exp.company.tenure.start, exp.company.tenure.end) / 6) / 2),
    projectCount:   ({ experience }) => String(experience.items.length),
    // Items flagged "research": true
    researchCount:  ({ experience, education }) => String([...experience.items, ...education.items].filter(i => i.research).length),
    // Distinct names across items' "clients" arrays
    clientCount:    ({ experience }) => String(new Set(experience.items.flatMap(i => i.clients || [])).size),
};

function renderAbout(data, ctx) {
    const paras = data.paragraphs.map(p => `<p>${richText(p)}</p>`).join('');
    const stats = data.stats.map(s => `
        <div class="stat-cell">
            <div class="stat-num" data-count>${esc(s.auto ? AUTO_STATS[s.auto](ctx) : s.value)}</div>
            <div class="stat-label">${esc(s.label)}</div>
        </div>`).join('');
    return `
    <div class="about-grid fade-in">
        <div class="about-text">${paras}</div>
        <div class="about-stats">${stats}</div>
    </div>
    ${peopleWallHtml(ctx)}`;
}

// Everyone referenced as {{key}} in Experience/Education, tagged with the projects they appear in
function peopleWallHtml(ctx) {
    const seen = new Map();
    const items = [...sortByStart(ctx.experience?.items || []), ...(ctx.education?.items || [])];
    for (const item of items) {
        const text = [item.summary, ...(item.bullets || [])].join(' ');
        for (const [, key] of text.matchAll(PERSON_TOKEN)) {
            if (!PEOPLE[key]) continue;
            if (!seen.has(key)) seen.set(key, new Set());
            seen.get(key).add(item.short || item.name || item.role);
        }
    }
    if (!seen.size) return '';
    const tiles = [...seen].map(([key, projects]) => {
        const p = PEOPLE[key];
        return `
        <a class="person-tile" href="${esc(p.href)}" target="_blank">
            <img src="${esc(p.photo)}" alt="" loading="lazy">
            <span class="person-tile-text">
                <span class="person-tile-name">${esc(p.name)}</span>
                <span class="person-tile-title">${esc(p.title)}</span>
                <span class="person-tile-dept">${esc(p.dept)}</span>
                <span class="person-tile-projects">${[...projects].map(esc).join(' · ')}</span>
            </span>
        </a>`;
    }).join('');
    return `
    <div class="people-wall fade-in">
        <p class="people-wall-label">Worked with</p>
        <div class="people-grid">${tiles}</div>
    </div>`;
}

// Stat numbers count up from 0 the first time they scroll into view
function setupCountUp() {
    if (REDUCED_MOTION) return;
    const els = [...document.querySelectorAll('[data-count]')]
        .map(el => ({ el, text: el.textContent.trim() }))
        .filter(({ text }) => /^\d+(\.\d+)?$/.test(text));
    els.forEach(({ el }) => { el.textContent = '0'; });
    const obs = new IntersectionObserver(entries => entries.forEach(e => {
        if (!e.isIntersecting) return;
        obs.unobserve(e.target);
        const { text } = els.find(x => x.el === e.target);
        const target = parseFloat(text), decimals = (text.split('.')[1] || '').length, t0 = performance.now();
        const tick = now => {
            const k = Math.min(1, (now - t0) / 1200), eased = 1 - Math.pow(1 - k, 3);
            e.target.textContent = (target * eased).toFixed(decimals);
            if (k < 1) requestAnimationFrame(tick); else e.target.textContent = text;
        };
        requestAnimationFrame(tick);
        // Safety net: rAF pauses in background tabs, so make sure the final value always lands
        setTimeout(() => { e.target.textContent = text; }, 1500);
    }), { threshold: 0.6 });
    els.forEach(({ el }) => obs.observe(el));
    // Stats that were never scrolled into view would otherwise print as 0
    addEventListener('beforeprint', () => els.forEach(({ el, text }) => { obs.unobserve(el); el.textContent = text; }));
}

// Colour names map to the --c-* custom properties in style.css
const SKILL_COLORS = ['blue', 'orange', 'purple', 'green'];

function renderSkills(data) {
    const groups = data.groups.map(g => {
        const color = `var(--c-${SKILL_COLORS.includes(g.color) ? g.color : 'purple'})`;
        return `
        <div class="skill-group" style="--skill-color: ${color}">
            <p class="skill-group-title">${esc(g.title)}</p>
            <ul class="skill-list">${g.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
        </div>`;
    }).join('');
    return `<div class="skills-grid fade-in">${groups}</div>`;
}

const MONTH_NUM = { Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12 };

function formatDate(date) {
    if (!date) return '';
    const fmt = d => d.month ? `${d.month} ${d.year}` : `${d.year}`;
    const end  = date.end ? fmt(date.end) : 'Present';
    return `${fmt(date.start)} — ${end}`;
}

function monthsBetween(start, end) {
    const s = new Date(start.year, (MONTH_NUM[start.month] || 1) - 1);
    const e = end ? new Date(end.year, (MONTH_NUM[end.month] || 1) - 1) : new Date();
    return (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth());
}

function calcDuration(start, end) {
    const months = monthsBetween(start, end);
    const yrs = Math.floor(months / 12);
    const mos = months % 12;
    const parts = [];
    if (yrs) parts.push(`${yrs} yr${yrs !== 1 ? 's' : ''}`);
    if (mos) parts.push(`${mos} mo${mos !== 1 ? 's' : ''}`);
    return parts.join(' ') || '< 1 mo';
}

function formatTenure(tenure) {
    if (typeof tenure === 'string') return tenure;
    const range    = formatDate({ start: tenure.start, end: tenure.end });
    const duration = calcDuration(tenure.start, tenure.end);
    return `${range} · ${duration} · ${tenure.location}`;
}

// Experience items render with a summary and collapsible bullets; education items show bullets inline
function timelineItemHtml(item, isProject, id = '') {
    const tags = item.tags.map(t =>
        `<span class="tag tag-${t.color}">${esc(t.text)}</span>`).join('');
    const bullets = item.bullets.map(b => `<li>${richText(b)}</li>`).join('');
    const list    = bullets ? `<ul class="exp-bullets">${bullets}</ul>` : '';
    const diagram = isProject && item.diagram ? archHtml(item.diagram) : '';
    const roleParts = item.name ? [item.role, item.type, item.location].filter(Boolean) : [];
    const tagData   = esc(JSON.stringify(item.tags.map(t => t.text))).replace(/"/g, '&quot;');
    return `
    <div class="timeline-item fade-in"${id ? ` id="${id}"` : ''} data-tags="${tagData}">
        <div class="timeline-date">${esc(typeof item.date === 'object' ? formatDate(item.date) : item.date)}</div>
        <div class="timeline-content">
            <p class="exp-role">${esc(item.name || item.role)}</p>
            ${roleParts.length ? `<p class="exp-role-sub">${roleParts.map(esc).join(' · ')}</p>` : ''}
            ${isProject && item.summary ? `<p class="exp-summary">${richText(item.summary)}</p>` : ''}
            ${tags ? `<div class="exp-tags">${tags}</div>` : ''}
            ${isProject && (list || diagram)
                ? `<details class="exp-details"><summary>Details <span class="exp-details-count">${item.bullets.length}</span>`
                  + `${diagram ? '<span class="exp-details-hint">+ architecture</span>' : ''}</summary>${diagram}${list}</details>`
                : list}
        </div>
    </div>`;
}

// ── Architecture diagrams ─────────────────────────────────────────────────────
// A left-to-right flow of stages; a stage with several nodes is drawn as parallel boxes.
// kind: "service" (default) | "data" | "device"; "via" labels the arrow into a stage.

const ARCH_KINDS = { service: 'Process', data: 'Data / external', device: 'Hardware / workers' };

function archHtml(diagram) {
    const node = n => typeof n === 'string' ? { label: n } : n;
    const kindsUsed = new Set();
    const stages = diagram.stages.map((s, i) => {
        const kind = ARCH_KINDS[s.kind] ? s.kind : 'service';
        kindsUsed.add(kind);
        // --i staggers the flowing data pulse so it travels stage by stage
        const arrow = i ? `<div class="arch-arrow" aria-hidden="true" style="--i:${i - 1}">${s.via ? `<span>${esc(s.via)}</span>` : ''}</div>` : '';
        const nodes = s.nodes.map(node).map(n =>
            `<div class="arch-node"><span class="arch-node-label">${esc(n.label)}</span>${n.sub ? `<span class="arch-node-sub">${esc(n.sub)}</span>` : ''}</div>`).join('');
        return `${arrow}<div class="arch-stage arch-${kind}">${nodes}</div>`;
    }).join('');
    const label = diagram.stages.map(s => s.nodes.map(n => node(n).label).join(' / ')).join(' → ');
    const legend = Object.keys(ARCH_KINDS).filter(k => kindsUsed.has(k))
        .map(k => `<span class="arch-key arch-${k}">${ARCH_KINDS[k]}</span>`).join('');
    return `
    <figure class="arch-wrap">
        <div class="arch" role="img" aria-label="Architecture: ${esc(label)}">${stages}</div>
        <figcaption class="arch-legend">${legend}</figcaption>
    </figure>`;
}

const sortByStart = items => [...items].sort((a, b) => {
    if (b.date.start.year !== a.date.start.year) return b.date.start.year - a.date.start.year;
    return (MONTH_NUM[b.date.start.month] || 0) - (MONTH_NUM[a.date.start.month] || 0);
});

// ── Gantt timeline ────────────────────────────────────────────────────────────
// One bar per project on a shared month axis, so overlapping work is visible at a glance

const monthIndex = d => d.year * 12 + (MONTH_NUM[d.month] || 1) - 1;
const nowIndex   = () => { const n = new Date(); return n.getFullYear() * 12 + n.getMonth(); };

function ganttHtml(sorted) {
    const span  = i => [monthIndex(i.date.start), i.date.end ? monthIndex(i.date.end) + 1 : nowIndex() + 1];
    const spans = sorted.map(span);
    const min = Math.min(...spans.map(s => s[0])), max = Math.max(...spans.map(s => s[1]));
    const pct = m => ((m - min) / (max - min) * 100).toFixed(2);
    const firstYear = Math.floor(min / 12) + 1, lastYear = Math.floor((max - 1) / 12);
    const ticks = [];
    for (let y = firstYear; y <= lastYear; y++) ticks.push(`<span class="gantt-tick" style="left:${pct(y * 12)}%">${y}</span>`);
    const rows = sorted.map((item, i) => {
        const [s, e] = spans[i];
        const title = `${item.name} · ${formatDate(item.date)}`;
        return `
        <div class="gantt-row" data-index="${i}">
            <span class="gantt-label">${esc(item.short || item.name)}</span>
            <div class="gantt-track">
                <button type="button" class="gantt-bar${item.date.end ? '' : ' is-ongoing'}" data-index="${i}"
                        style="left:${pct(s)}%;width:${pct(e) - pct(s)}%" title="${esc(title)}" aria-label="${esc(title)}"></button>
            </div>
        </div>`;
    }).join('');
    return `
    <div class="gantt fade-in" style="--rows:${sorted.length}">
        <div class="gantt-rows">${rows}</div>
        <div class="gantt-axis"><span class="gantt-label"></span><div class="gantt-track">${ticks.join('')}</div></div>
    </div>`;
}

function renderExperience(data) {
    const sorted = sortByStart(data.items);
    const items = sorted.map((item, i) => timelineItemHtml(item, true, `project-${i}`)).join('');
    const logo  = data.company.logo
        ? `<img class="company-logo" src="${data.company.logo}" alt="${esc(data.company.name)} logo">`
        : '';
    // Only offer filters that match at least one project
    const filters = (data.filters || []).map(f => ({
        ...f, count: sorted.filter(i => i.tags.some(t => f.match.includes(t.text))).length,
    })).filter(f => f.count);
    const chip = (label, count, i, active) =>
        `<button type="button" class="filter-chip${active ? ' is-active' : ''}" data-filter="${i}" aria-pressed="${active}">${esc(label)} <span>${count}</span></button>`;
    return `
    <div class="exp-toolbar fade-in">
        <div class="filter-chips" role="group" aria-label="Filter projects by technology">
            ${chip('All', sorted.length, -1, true)}${filters.map((f, i) => chip(f.label, f.count, i, false)).join('')}
        </div>
        <button type="button" class="exp-toggle-all" aria-pressed="false">Expand all</button>
    </div>
    <div class="company-header fade-in">
        <span class="company-name">${logo}${esc(data.company.name)}</span>
        <span class="company-tenure">${esc(formatTenure(data.company.tenure))}</span>
    </div>
    ${ganttHtml(sorted)}
    <div class="timeline" id="exp-timeline">${items}</div>
    <p class="exp-filter-empty" hidden>No projects match this filter.</p>`;
}

function setupExperienceControls(data) {
    const section  = document.getElementById('experience');
    const items    = [...section.querySelectorAll('#exp-timeline .timeline-item')];
    const chips    = [...section.querySelectorAll('.filter-chip')];
    const toggle   = section.querySelector('.exp-toggle-all');
    const filters  = (data.filters || []).filter(f => data.items.some(i => i.tags.some(t => f.match.includes(t.text))));

    const apply = idx => {
        const match = idx < 0 ? null : filters[idx].match;
        chips.forEach(c => {
            const on = Number(c.dataset.filter) === idx;
            c.classList.toggle('is-active', on);
            c.setAttribute('aria-pressed', on);
        });
        items.forEach((el, i) => {
            const tags = JSON.parse(el.dataset.tags);
            const show = !match || tags.some(t => match.includes(t));
            el.hidden = !show;
            el.querySelectorAll('.tag').forEach(t => t.classList.toggle('is-match', !!match && match.includes(t.textContent)));
            if (show) el.classList.add('visible');
            // Gantt rows stay in place (so the time axis keeps its context) but dim when filtered out
            section.querySelector(`.gantt-row[data-index="${i}"]`)?.classList.toggle('is-dim', !show);
        });
        section.querySelector('.exp-filter-empty').hidden = items.some(el => !el.hidden);
    };

    // Clicking a Gantt bar scrolls to its project (clearing a filter that hides it) and briefly highlights it
    section.querySelectorAll('.gantt-bar').forEach(bar => bar.addEventListener('click', () => {
        const el = items[Number(bar.dataset.index)];
        if (el.hidden) apply(-1);
        el.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'center' });
        el.classList.remove('is-flash');
        void el.offsetWidth;
        el.classList.add('is-flash');
    }));
    chips.forEach(c => c.addEventListener('click', () => apply(Number(c.dataset.filter))));

    // Clicking a tag inside a project applies the first filter that covers it
    section.addEventListener('click', e => {
        const tag = e.target.closest('#exp-timeline .tag');
        if (!tag) return;
        const idx = filters.findIndex(f => f.match.includes(tag.textContent));
        if (idx >= 0) apply(idx);
    });
    items.forEach(el => el.querySelectorAll('.tag').forEach(t => {
        if (filters.some(f => f.match.includes(t.textContent))) t.classList.add('is-filterable');
    }));

    const details = [...section.querySelectorAll('.exp-details')];
    const syncToggle = () => {
        const allOpen = details.every(d => d.open);
        toggle.textContent = allOpen ? 'Collapse all' : 'Expand all';
        toggle.setAttribute('aria-pressed', allOpen);
    };
    toggle.addEventListener('click', () => {
        const open = !details.every(d => d.open);
        details.forEach(d => { d.open = open; });
        syncToggle();
    });
    details.forEach(d => d.addEventListener('toggle', syncToggle));

    // Printing always shows every project fully expanded; the reader's open/closed state comes back afterwards
    let openBeforePrint = [];
    addEventListener('beforeprint', () => {
        apply(-1);
        openBeforePrint = details.map(d => d.open);
        details.forEach(d => { d.open = true; });
    });
    addEventListener('afterprint', () => details.forEach((d, i) => { d.open = openBeforePrint[i]; }));
}

function renderEducation(data) {
    const items = data.items.map(i => timelineItemHtml(i, false)).join('');
    return `
    <div class="company-header fade-in">
        <span class="company-name">${esc(data.institution.name)}</span>
        <span class="company-tenure">${esc(data.institution.tenure)}</span>
    </div>
    <div class="timeline">${items}</div>`;
}

function renderContact(data) {
    const links = data.links.map(l => `
        <a class="contact-link" href="${l.href}" target="_blank">
            ${l.qr ? `<img class="contact-link-qr" src="${l.qr}" alt="${esc(l.label)} QR">` : ''}
            <span class="contact-link-label">↗ ${esc(l.label)}</span>
        </a>`).join('');
    return `
    <div class="contact-inner fade-in">
        <p class="contact-desc">${esc(data.description)}</p>
        ${data.email ? `<p class="contact-email"><a class="text-link" href="mailto:${esc(data.email)}">✉ ${esc(data.email)}</a></p>` : ''}
        <div class="contact-links">${links}</div>
    </div>`;
}

// Contact line under the name, shown only on paper (the Contact section itself isn't printed)
function printContactHtml(data) {
    const site  = new URL(document.querySelector('link[rel="canonical"]')?.href || location.href).hostname;
    const items = [site, data.email, ...data.links.map(l => l.href.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))];
    return `<p class="print-only print-contact">${items.filter(Boolean).map(esc).join('  ·  ')}</p>`;
}

const RENDERERS = { about: renderAbout, skills: renderSkills, experience: renderExperience, education: renderEducation, contact: renderContact };

// ── Fade-in observer ──────────────────────────────────────────────────────────

function setupFadeIn() {
    const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
            if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
        });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
    const [manager, hero, people] = await Promise.all([
        fetch('content/manager.json').then(r => r.json()),
        fetch('content/hero.json').then(r => r.json()),
        fetch('content/people.json').then(r => r.json()),
    ]);
    PEOPLE = people;

    renderNav(manager.sections);
    renderHero(hero);
    decodeHeroName();
    setupTabTitle();
    setupKonami();
    consoleHello();
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    // Fetch all sections up front so About can derive stats from Experience
    const datas = await Promise.all(manager.sections.map(s =>
        fetch('content/' + s.file).then(r => r.json())));
    const ctx  = Object.fromEntries(manager.sections.map((s, i) => [s.id, datas[i]]));

    const container = document.getElementById('sections-container');
    for (const [i, section] of manager.sections.entries()) {
        const renderer = RENDERERS[section.id];
        if (!renderer) continue;
        container.insertAdjacentHTML('beforeend', sectionHtml(section, i + 1, renderer(datas[i], ctx)));
    }
    if (ctx.contact) document.getElementById('home').insertAdjacentHTML('beforeend', printContactHtml(ctx.contact));

    setupFadeIn();
    setupCountUp();
    if (ctx.experience) setupExperienceControls(ctx.experience);
    setupTerminal(hero, manager.sections, ctx);
}

init();
</script>
